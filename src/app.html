<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>企鹅窝 - 能学、能玩、能干活的 Linux 社区</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f5f6f8;--card:#fff;--text:#222;--muted:#888;--primary:#16a34a;--border:#e5e7eb;--danger:#dc2626;--input-bg:#fff;--hl:#f0fdf4}
[data-theme=dark]{--bg:#0d1117;--card:#161b22;--text:#e6edf3;--muted:#a0aab5;--primary:#3fb950;--border:#30363d;--danger:#f85149;--input-bg:#0d1117;--hl:#0d2818}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;max-width:1100px;margin:0 auto;min-height:100vh}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
header .logo{font-size:18px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0}
@media(max-width:640px){header .logo{font-size:15px}}
header .user{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
header .user button{background:none;border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer;color:var(--text);white-space:nowrap;flex-shrink:0}
.hnav{cursor:pointer;font-size:14px;color:var(--muted);white-space:nowrap;padding:4px 6px}
.hnav:hover{color:var(--primary)}
@media(max-width:640px){.hnav{font-size:12px;padding:4px 2px}}
.umenu{position:absolute;top:100%;right:0;background:var(--card);border:1px solid var(--border);border-radius:10px;min-width:140px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:50;overflow:hidden;display:none}
.umenu.open{display:block}
.umenu div{padding:10px 14px;cursor:pointer;font-size:14px;white-space:nowrap}
.umenu div:hover{background:var(--hover)}
.umenu div.danger{color:#ef4444}
.hnav{cursor:pointer;font-size:13px;padding:6px 8px;border-radius:8px;white-space:nowrap;flex-shrink:0}
.hnav:hover{background:var(--hl)}
@media(max-width:640px){.hnav{font-size:12px;padding:6px 4px}}
main{padding:12px 12px 80px}
.card{background:var(--card);border-radius:12px;padding:14px 16px;margin-bottom:10px;border:1px solid var(--border)}
.board{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:12px 0;border-bottom:1px solid var(--border)}
.board:last-child{border-bottom:none}
.board .nm{font-size:16px;font-weight:600}
.board .ds{font-size:13px;color:var(--muted);margin-top:4px}
.board .meta{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap;margin-left:8px}
.thread{display:block;cursor:pointer;padding:12px 0;border-bottom:1px solid var(--border)}
.thread:last-child{border-bottom:none}
.thread .ti{font-size:15px;font-weight:600}
.thread .ti .pin{color:var(--primary);font-size:12px;border:1px solid var(--primary);border-radius:4px;padding:1px 5px;margin-right:6px}
.thread .mt{font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:10px}
.post{padding:16px;border-bottom:1px solid var(--border);background:var(--card);border-radius:12px;margin-bottom:12px;border:1px solid var(--border)}
.post:last-child{margin-bottom:0}
.post .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.post .ph .author-info{display:flex;align-items:center;gap:10px}
.post .ph .author-info img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.post .ph .author-info .avatar-letter{width:40px;height:40px;border-radius:50%;background:var(--primary);color:#fff;font-size:18px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;margin:0}
.post .ph .author-meta{display:flex;flex-direction:column;gap:2px}
.post .ph .au{color:var(--primary);font-weight:700;font-size:15px}
.post .ph .author-sub{font-size:12px;color:var(--muted)}
.post .ph .floor{font-size:13px;color:var(--muted);background:var(--bg);padding:4px 10px;border-radius:20px;font-weight:600}
.post .pc{white-space:pre-wrap;word-break:break-word;line-height:1.9;font-size:15px;color:var(--text)}
.post .pc pre{background:#0d1117;border:1px solid var(--border);border-radius:8px;padding:12px;overflow-x:auto;margin:10px 0;font-size:13px;line-height:1.6}
.post .pc blockquote{border-left:3px solid var(--primary);margin:10px 0;padding:8px 14px;background:var(--bg);border-radius:0 8px 8px 0;color:var(--muted);font-size:14px}
.post .pc .quote-head{background:var(--bg);border:1px solid var(--border);border-bottom:none;border-radius:8px 8px 0 0;padding:8px 14px;font-size:13px;color:var(--text);margin:10px 0 0}
.post .pc .quote-head + blockquote{margin-top:0;border-radius:0 0 8px 0}
.post .ops{margin-top:12px;padding-top:10px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center}
.post .ops button{background:var(--bg);border:1px solid var(--border);border-radius:20px;font-size:13px;cursor:pointer;padding:6px 14px;color:var(--muted);transition:all .2s}
.post .ops button:hover{border-color:var(--primary);color:var(--primary)}
.post .ops button.like.on{color:#e11d48;border-color:#e11d48;font-weight:700;background:#fff1f2}
.op-post{border-left:3px solid var(--primary)}
.solution-post{border:2px solid #16a34a;background:linear-gradient(to bottom,var(--hl),var(--card))}
h2.tt{font-size:18px;margin-bottom:4px}
textarea,input[type=text],input[type=password]{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;font-size:15px;margin-bottom:10px;background:var(--input-bg);color:var(--text);outline:none;transition:border-color .15s}
textarea:focus,input[type=text]:focus,input[type=password]:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb, var(--primary) 15%, transparent)}
[data-theme=dark] textarea,[data-theme=dark] input[type=text],[data-theme=dark] input[type=password]{border-color:#3d444d}
select{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;font-size:15px;margin-bottom:10px;background:var(--input-bg);color:var(--text)}
textarea{min-height:100px;resize:vertical}
.btn{background:var(--primary);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-size:15px;cursor:pointer;width:100%}
.btn.ghost{background:var(--card);color:var(--text);border:1.5px solid var(--border)}
.fab{display:none}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:flex-start;justify-content:center;padding-top:15vh}
#modal.show{display:flex}
#modal .box{background:var(--card);border-radius:14px;padding:20px;width:88%;max-width:380px}
#modal .box h3{margin-bottom:14px;padding-right:28px}
#modal .box{position:relative}
#modal .x{position:absolute;top:12px;right:14px;font-size:20px;color:var(--muted);cursor:pointer;line-height:1;padding:4px}
#modal .x:hover{color:var(--text)}
.skel{border-radius:8px;background:linear-gradient(90deg,var(--border) 25%,var(--card) 50%,var(--border) 75%);background-size:200% 100%;animation:skel 1.2s infinite}
@keyframes skel{0%{background-position:200% 0}100%{background-position:-200% 0}}
#modal .box .row{display:flex;gap:10px}
.hint{font-size:13px;color:var(--muted);text-align:center;padding:30px 0}
.err{color:var(--danger);font-size:13px;margin:-4px 0 10px;min-height:18px}
.toolbar{display:flex;gap:8px;margin-bottom:10px}
.toolbar .btn{width:auto;padding:8px 14px;font-size:14px}
.admin-tag{font-size:11px;color:#fff;background:var(--primary);border-radius:4px;padding:1px 5px;margin-left:4px}
.post .pc img{max-width:100%;border-radius:8px;margin:8px 0;display:block}
.post .pc .mention{color:var(--primary);font-weight:600;background:var(--hl);border-radius:4px;padding:0 4px}
.post .ops button.danger{color:var(--danger)}
.searchbar{display:flex;gap:8px;margin-bottom:10px}
.searchbar input{margin-bottom:0}
.searchbar .btn{width:auto;white-space:nowrap}
.bell{position:relative;cursor:pointer;font-size:18px}
.bell .dot{position:absolute;top:-4px;right:-6px;background:#e11d48;color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;text-align:center;line-height:16px;padding:0 4px}
.notif{padding:10px 0;border-bottom:1px solid var(--border);font-size:14px;cursor:pointer}
.notif:last-child{border-bottom:none}
.notif.unread{background:var(--hl);border-radius:8px;padding:10px}
.notif .tm{font-size:12px;color:var(--muted);margin-top:4px}
.upbar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.upbar input[type=file]{display:none}
.edtools{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.edtools button{background:var(--bg);border:1px solid var(--border);border-radius:8px;min-width:34px;height:32px;font-size:14px;cursor:pointer;color:var(--text);padding:0 8px}
.edtools button:active{background:var(--border)}
.emoji-picker{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px;margin-bottom:8px;max-height:180px;overflow-y:auto;line-height:1}
/* 图片灯箱 */
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:200;display:none;align-items:center;justify-content:center}
#lightbox.show{display:flex}
#lightbox img{max-width:92vw;max-height:88vh;border-radius:8px}
#lightbox .lb-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);border:none;color:#fff;font-size:28px;width:48px;height:48px;border-radius:50%;cursor:pointer}
#lightbox .lb-prev{left:16px}
#lightbox .lb-next{right:16px}
#lightbox .lb-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:20px;width:40px;height:40px;border-radius:50%;cursor:pointer}
#lightbox .lb-count{position:absolute;bottom:20px;color:#fff;font-size:14px}
/* @自动补全 */
.at-list{position:absolute;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.15);z-index:150;max-height:200px;overflow-y:auto;min-width:180px}
.at-item{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;font-size:14px}
.at-item:hover,.at-item.on{background:var(--bg)}
/* 权限隐藏块 */
.hide-lock{background:var(--bg);border:1.5px dashed var(--border);border-radius:10px;padding:14px;text-align:center;color:var(--muted);font-size:14px;margin:8px 0}
.hide-show{background:var(--hl);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:8px 0}
.hide-show .hide-tag{font-size:12px;color:var(--muted);margin-bottom:6px}
/* 统计横条 */
.stat-bar{display:flex;gap:16px;justify-content:center;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.stat-bar b{color:var(--primary);font-size:16px;margin-right:4px}
/* 侧边栏布局 */
.layout{max-width:1100px;margin:0 auto;display:flex;gap:16px;padding:0 12px;align-items:flex-start}
.layout main{flex:1;min-width:0;padding:12px 0 80px}
#sidebar{width:240px;flex-shrink:0;position:sticky;top:70px;max-height:calc(100vh - 90px);overflow-y:auto;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px;display:none}
.layout.has-sidebar #sidebar{display:block}
.layout.sidebar-collapsed #sidebar{display:none}
.sb-board{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14px}
.sb-board:hover{background:var(--bg)}
.sb-board.on{background:var(--hl);color:var(--primary);font-weight:600}
.sb-board .cnt{font-size:12px;color:var(--muted)}
.sb-title{font-size:12px;color:var(--muted);padding:8px 12px 4px}
#sidebar-toggle{display:none;background:none;border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:14px;cursor:pointer;color:var(--text)}
.layout.has-sidebar #sidebar-toggle{display:inline-block}
#drawer-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;display:none}
#drawer-mask.show{display:block}
@media(max-width:1023px){
  .layout{display:block;max-width:720px}
  .layout main{padding:12px 12px 80px}
  #sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:95;border-radius:0;max-height:none;transform:translateX(-100%);transition:transform .25s;display:block}
  #sidebar.open{transform:none}
  #sidebar-toggle{display:inline-block !important}
}
.upbar .upbtn{border:1.5px dashed var(--border);border-radius:10px;padding:8px 14px;font-size:13px;color:var(--muted);cursor:pointer;background:var(--card)}
.upbar .upbtn:active{background:var(--hover,#f0f0f0)}
.quotebox{background:var(--bg);border-left:3px solid var(--primary);padding:8px 12px;margin-bottom:8px;border-radius:0 8px 8px 0;font-size:13px;color:var(--muted);white-space:pre-wrap;max-height:120px;overflow:hidden}
.profile-hd{text-align:center;padding:20px 0 10px}
.profile-hd .avatar{width:64px;height:64px;border-radius:50%;background:var(--primary);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.profile-hd .nm{font-size:18px;font-weight:700}
.profile-hd .st{font-size:13px;color:var(--muted);margin-top:6px;display:flex;gap:16px;justify-content:center}
.avatar-img{width:28px;height:28px;border-radius:50%;object-fit:cover;vertical-align:-8px;margin-right:6px}
.avatar-letter{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;font-size:14px;display:inline-flex;align-items:center;justify-content:center;vertical-align:-8px;margin-right:6px;font-weight:700}
.avatar-big{width:80px;height:80px;border-radius:50%;object-fit:cover}
.avatar-big-letter{width:80px;height:80px;border-radius:50%;background:var(--primary);color:#fff;font-size:36px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-weight:700}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:9px 16px;font-size:14px;cursor:pointer;color:var(--text);white-space:nowrap;flex-shrink:0;transition:all .15s}
.tabs button:hover{border-color:var(--primary);color:var(--primary)}
.tabs button.on{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.stat .n{font-size:28px;font-weight:700;color:var(--primary)}
.stat .l{font-size:12px;color:var(--muted);margin-top:4px}
.urow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
.urow:last-child{border-bottom:none}
.urow .info{flex:1;min-width:0}
.urow .info .nm{font-weight:600}
.urow .info .em{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.urow .tag{font-size:11px;border-radius:4px;padding:1px 6px;margin-left:4px}
.tag.ban{background:#fee2e2;color:#dc2626}
.tag.nv{background:#fef3c7;color:#d97706}
.tag.adm{background:#dbeafe;color:#2563eb}
.urow .abtns{display:flex;gap:6px;flex-wrap:wrap}
.urow .abtns button{background:none;border:1px solid var(--border);border-radius:8px;padding:4px 8px;font-size:12px;cursor:pointer}
.urow .abtns button.danger{color:var(--danger);border-color:#fecaca}
.setrow{margin-bottom:16px}
.setrow label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.setrow input{margin-bottom:0}
.thread-tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.thread-tools button{background:var(--card);border:1.5px solid var(--border);border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer;color:var(--text)}
.thread-tools button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
#toTop{position:fixed;bottom:24px;right:20px;width:44px;height:44px;border-radius:50%;background:var(--card);border:1.5px solid var(--border);font-size:18px;cursor:pointer;display:none;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.post.op-post{border-left:3px solid var(--primary)}
.post.solution-post{border:2px solid var(--primary);background:var(--hl)}
.solution-badge{display:inline-block;font-size:11px;color:#fff;background:var(--primary);border-radius:4px;padding:1px 6px;margin-left:4px;font-weight:700}
.floor-badge{font-size:11px;background:var(--bg);border-radius:6px;padding:1px 6px;color:var(--muted)}
</style>

<header>
  <div style="display:flex;align-items:center;gap:8px">

  </div>

    <input type="text" id="q" placeholder="搜索帖子…" onkeydown="if(event.key==='Enter')doSearch()">

</div>

  <main id="app"><div class="card"><div class="skel" style="height:22px;width:60%;margin-bottom:12px"></div><div class="skel" style="height:14px;width:90%;margin-bottom:8px"></div><div class="skel" style="height:14px;width:75%"></div></div><div class="card"><div class="skel" style="height:22px;width:50%;margin-bottom:12px"></div><div class="skel" style="height:14px;width:85%;margin-bottom:8px"></div><div class="skel" style="height:14px;width:65%"></div></div></main>
</div>

</div>

<script>
const app = document.getElementById('app');
let me = null;
let siteSettings = { site_name: '论坛', site_logo: '💬', site_desc: '', announcement: '' };
let globalAds = {}, globalLinks = [];
async function loadAds(){
  try{
    const j = await api('/api/ads');
    globalAds = j.ads || {};
  }catch(e){ globalAds = {}; }
  try{
    const l = await api('/api/friend-links');
    globalLinks = l.links || [];
  }catch(e){ globalLinks = []; }
  renderFooterLinks();
}
function adHtml(position){
  const list = globalAds[position];
  if(!list || !list.length) return '';
  return list.map(a=>
    '<div class="ad-box" style="margin:12px 0;padding:10px;border:1px dashed var(--border);border-radius:8px;text-align:center;position:relative">'+
    '<span style="position:absolute;top:2px;right:6px;font-size:10px;color:var(--muted)">广告</span>'+
    (a.img_url ? '<a href="'+esc(a.url)+'" target="_blank" onclick="adClick('+a.id+')"><img src="'+esc(a.img_url)+'" style="max-width:100%;border-radius:6px" loading="lazy"></a>'
     : '<a href="'+esc(a.url)+'" target="_blank" onclick="adClick('+a.id+')" style="color:var(--primary);font-size:14px">📢 '+esc(a.title)+'</a>')+
    '</div>'
  ).join('');
}
function adClick(id){
  api('/api/ads/'+id+'/click', {method:'POST'}).catch(()=>{});
}
function renderFooterLinks(){
  const box = document.getElementById('friend-links');
  if(!box) return;

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function timeAgo(ts){
  const d = Date.now()-ts;
  if(d<60e3) return '刚刚';
  if(d<3600e3) return Math.floor(d/60e3)+' 分钟前';
  if(d<86400e3) return Math.floor(d/3600e3)+' 小时前';
  if(d<30*86400e3) return Math.floor(d/86400e3)+' 天前';
  return new Date(ts).toLocaleDateString();
}

/* 内容渲染：转义后支持外链图片、@高亮、**加粗**、*斜体*、`代码`、权限块 */
function renderContent(s){
  let h = esc(s);
  h = h.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  h = h.replace(/^&gt; \[quote pid=(\d+) author=([^\]]+) floor=([^\]]+)\]$/gm,
    '<div class="quote-head" onclick="goToPost($1)" style="cursor:pointer">📎 引用 @$2 <span style="color:var(--muted)">#$3</span> <span style="font-size:12px">👉 跳转</span></div>');
  h = h.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  h = h.replace(/!\[([^\]]*)\]\((https?:\/\/[^)\s]+)\)/g, '<img src="$2" alt="$1" loading="lazy" referrerpolicy="no-referrer" onclick="openLightbox(this)">');
  h = h.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  h = h.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>');
  h = h.replace(/`([^`\n]+)`/g, '<code style="background:var(--bg);padding:2px 8px;border-radius:4px;font-size:13px;font-family:monospace;border:1px solid var(--border)">$1</code>');
  h = h.replace(/@([a-zA-Z0-9_\u4e00-\u9fa5]{2,16})/g, '<span class="mention">@$1</span>');
  h = h.replace(/\{\{SHOW\}\}([\s\S]*?)\{\{\/SHOW\}\}/g, '<div class="hide-show"><div class="hide-tag">🔓 隐藏内容</div>$1</div>');
  h = h.replace(/\{\{HIDE\}\}/g, '<div class="hide-lock">🔒 此处内容回复后可见</div>');
  h = h.replace(/\{\{LEVEL:(\d+)\}\}/g, '<div class="hide-lock">🔒 需要 $1 积分可见（发帖回帖可攒积分）</div>');
  h = h.replace(/\{\{ADMIN\}\}/g, '<div class="hide-lock">🔒 仅管理员可见</div>');
  // 裸 URL 自动转可点击链接（最后处理，避免破坏已生成的标签属性）
  h = h.replace(/(^|[\s>（(\[{「『一-鿿])(https?:\/\/[^\s<>"'\]）】」』，。！？；：一-鿿]+)/g, function(m, pre, url){
    let trail = '';
    while (url.length && /[.,!?;:]/.test(url.slice(-1))) { trail = url.slice(-1) + trail; url = url.slice(0, -1); }
    // 右括号：只有多余（不成对）时才剥掉，保留 wikipedia 式 URL 里的括号
    while (url.slice(-1) === ')' && (url.match(/\(/g) || []).length < (url.match(/\)/g) || []).length) { trail = ')' + trail; url = url.slice(0, -1); }
    if (!url) return m;
    return pre + '<a href="' + url + '" target="_blank" rel="noopener">' + url + '</a>' + trail;
  });
  return h;
}

/* @自动补全 */
let atBox = null, atTarget = null, atQuery = '', atIndex = 0, atUsers = [];
function bindAtComplete(boxId){
  const box = document.getElementById(boxId);
  if(!box || box.dataset.atBound) return;
  box.dataset.atBound = '1';
  box.addEventListener('input', ()=>atOnInput(box));
  box.addEventListener('keydown', e=>{
    if(!atBox || atBox.style.display === 'none') return;
    if(e.key === 'ArrowDown'){ e.preventDefault(); atIndex = (atIndex + 1) % atUsers.length; atRender(); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); atIndex = (atIndex - 1 + atUsers.length) % atUsers.length; atRender(); }
    else if(e.key === 'Enter' || e.key === 'Tab'){ e.preventDefault(); atSelect(atIndex); }
    else if(e.key === 'Escape'){ atHide(); }
  });
  box.addEventListener('blur', ()=>setTimeout(atHide, 200));
}
async function atOnInput(box){
  const pos = box.selectionStart;
  const before = box.value.slice(0, pos);
  const m = before.match(/@([a-zA-Z0-9_\u4e00-\u9fa5]{1,16})$/);
  if(!m){ atHide(); return; }
  atTarget = box; atQuery = m[1]; atIndex = 0;
  try{
    const j = await api('/api/users/search?q=' + encodeURIComponent(atQuery));
    atUsers = j.users.filter(u => u.name !== (me && me.name));
    if(!atUsers.length){ atHide(); return; }
    atRender();
  }catch(e){ atHide(); }
}
function atRender(){
  if(!atBox){
    atBox = document.createElement('div');
    atBox.className = 'at-list';
    document.body.appendChild(atBox);
  }
  const r = atTarget.getBoundingClientRect();
  atBox.style.left = (r.left + window.scrollX) + 'px';
  atBox.style.top = (r.bottom + window.scrollY + 4) + 'px';
  atBox.style.display = 'block';
  atBox.innerHTML = atUsers.map((u, i)=>
    '<div class="at-item'+(i===atIndex?' on':'')+'" onmousedown="atSelect('+i+')">'+avatarHtml(u.avatar_url, u.name)+esc(u.name)+'</div>'
  ).join('');
}
function atHide(){ if(atBox) atBox.style.display = 'none'; }
function atSelect(i){
  const u = atUsers[i];
  if(!u || !atTarget) return;
  const pos = atTarget.selectionStart;
  const before = atTarget.value.slice(0, pos);
  const newBefore = before.replace(/@[a-zA-Z0-9_\u4e00-\u9fa5]{1,16}$/, '@' + u.name + ' ');
  atTarget.value = newBefore + atTarget.value.slice(pos);
  atTarget.focus();
  atHide();
  saveDraft(atTarget.id);
}

function renderTurnstile(containerId){
  const key = turnstileSitekey();
  if(!key) return;
  const load = ()=>{
    if(typeof turnstile === 'undefined'){ setTimeout(load, 300); return; }
    try{ if(turnstileWidgetId !== null) turnstile.remove(turnstileWidgetId); }catch(e){}
    turnstileWidgetId = turnstile.render('#'+containerId, { sitekey: key, theme: 'auto', language: 'zh-CN' });
  };
  if(typeof turnstile === 'undefined'){
    const s = document.createElement('script');
    s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js';
    s.async = true; s.defer = true;
    s.onload = load;
    document.head.appendChild(s);
  } else load();
}
function getTurnstileToken(){
  const key = turnstileSitekey();
  if(!key) return '';
  try{ return turnstile.getResponse(turnstileWidgetId) || ''; }catch(e){ return ''; }
}
function resetTurnstile(){
  try{ if(turnstileWidgetId !== null) turnstile.reset(turnstileWidgetId); }catch(e){}
}
function turnstileDiv(){
  return turnstileSitekey() ? '<div id="ts-widget" style="margin:8px 0;display:flex;justify-content:center"></div>' : '';
}

/* ---------- 路由（History API） ---------- */
function navigate(path){
  history.pushState({}, '', path);
  loadSidebar();
  route();
  window.scrollTo(0, 0);
}
async function route(){
  const h = location.pathname + location.search;

  document.getElementById('searchbar').style.display = (h === '/' || h.startsWith('/search')) ? '' : 'none';
  let m;
  if(m = h.match(/^\/verify\?token=([\w-]+)/)) return viewVerify(m[1]);
  if(m = h.match(/^\/reset\?token=([\w-]+)/)) return viewReset(m[1]);
  if(m = h.match(/^\/search\?q=(.*)/)) return viewSearch(decodeURIComponent(m[1]));
  if(h === '/notifications') return viewNotifications();
  if(h === '/settings') return viewSettings();
  if(h === '/favorites') return viewFavorites();
  if(h === '/rules') return viewRules();
  if(h === '/dm') return viewDmList();
  if(m = h.match(/^\/dm\/(\d+)/)) return viewDmChat(Number(m[1]));
  if(h === '/admin') return viewAdmin('stats');
  if(m = h.match(/^\/admin\/(users|boards|site|reports|words|logs|ads|links|shop)/)) return viewAdmin(m[1]);
  if(h === '/tools') return viewTools();
  if(h === '/rankings') return viewRankings();
  if(h === '/shop') return viewShop();
  if(m = h.match(/^\/shop\/(\d+)$/)) return viewShopDetail(Number(m[1]));
  if(h === '/tools/diff') return viewDiffTool();
  if(h === '/tools/distro') return viewDistroTool();
  if(h === '/tools/shellcheck') return viewShellcheckTool();
  if(m = h.match(/^\/tools\/explain(?:\?cmd=(.*))?/)) return viewExplainTool(m[1] ? decodeURIComponent(m[1]) : '');
  if(h === '/tools/quiz' || h.match(/^\/tools\/quiz\?score=/) || h === '/tools/level') return viewQuiz();
  if(m = h.match(/^\/u\/(\d+)/)) return viewProfile(Number(m[1]));
  if(m = h.match(/^\/b\/(\d+)(?:\?p=(\d+))?/)) return viewThreads(Number(m[1]), Number(m[2]||1));
  if(m = h.match(/^\/t\/(\d+)(?:\?p=(\d+))?/)) return viewThread(Number(m[1]), Number(m[2]||1));
  return viewBoards();
}
function doSearch(){
  const q = document.getElementById('q').value.trim();
  if(q) navigate('/search?q=' + encodeURIComponent(q));
}
async function viewSearch(q){
  setTitle('搜索');
  try{ document.getElementById('q').value = q; }catch(e){}
  app.innerHTML = '<div class="hint">搜索中…</div>';
  let j;
  try{ j = await api('/api/search?q=' + encodeURIComponent(q)); }
  catch(e){ app.innerHTML = '<div class="hint">搜索失败：'+esc(e.message)+' <a href="javascript:route()">重试</a></div>'; return; }
  let html = '<div class="crumb" onclick="navigate(\'/\')">‹ 全部版块</div>';
  html += '<div class="card"><h2 class="tt">搜索：'+esc(q)+'</h2><div style="font-size:13px;color:var(--muted)">找到 '+j.results.length+' 个主题</div>';
  if(!j.results.length) html += '<div class="hint">没有找到相关主题，换个关键词试试</div>';
  j.results.forEach(t=>{
    html += '<div class="thread" onclick="navigate(\'/t/'+t.id+'\')">'+
      '<div class="ti">'+(t.is_digest?'<span class="pin" style="color:#d97706;border-color:#d97706">精华</span>':'')+(t.is_locked?'<span class="pin" style="color:#6b7280;border-color:#6b7280">🔒</span>':'')+esc(t.title)+'</div>'+
      '<div class="mt"><span style="cursor:pointer;color:var(--primary)" onclick="event.stopPropagation();navigate(\'/u/'+t.user_id+'\')">'+esc(t.author)+'</span><span>'+esc(t.board_name)+'</span><span>'+t.reply_count+' 回复</span><span>'+timeAgo(t.updated_at)+'</span></div></div>';
  });
  html += '</div>';
  app.innerHTML = html;
}

async function viewNotifications(){
  setTitle('通知');
  if(!me){ showLogin(); return; }
  app.innerHTML = '<div class="hint">加载中…</div>';
  try{
    const j = await api('/api/notifications');
    let html = '<div class="crumb" onclick="navigate(\'/\')">‹ 全部版块</div>';
    html += '<div class="card"><h2 class="tt">通知</h2>';
    if(!j.notifications.length) html += '<div class="hint">还没有人 @ 你</div>';
    j.notifications.forEach(n=>{
      const target = n.post_id
        ? 'goToPost('+n.post_id+')'
        : 'navigate(\'/t/'+n.thread_id+'\'';
      const text = n.type === 'reply'
        ? '<b>'+esc(n.from_name)+'</b> 回复了你的主题「'+esc(n.thread_title)+'」'
        : '<b>'+esc(n.from_name)+'</b> 在「'+esc(n.thread_title)+'」中 @ 了你';
      html += '<div class="notif'+(n.is_read?'':' unread')+'" onclick="'+target+'">'+text+
        '<div class="tm">'+timeAgo(n.created_at)+'</div></div>';
    });
    html += '</div>';
    app.innerHTML = html;
    if(j.unread > 0){ await api('/api/notifications/read', {method:'POST'}); loadNotifCount(); }
  }catch(e){
    app.innerHTML = '<div class="hint">加载失败：'+esc(e.message)+' <a href="javascript:route()">重试</a></div>';
  }
}

async function saveProfile(){

  const bio = document.getElementById('s-bio').value.trim();
  try{
    await api('/api/me', {method:'PUT', body:JSON.stringify({avatar_url, bio})});
    await refreshMe(); route();
  }catch(e){ alert(e.message); }
}
async function changePassword(){
  const old_password = document.getElementById('s-oldpass').value;
  const new_password = document.getElementById('s-newpass').value;
  try{
    await api('/api/me/password', {method:'PUT', body:JSON.stringify({old_password, new_password})});
    alert('密码修改成功');
    document.getElementById('s-oldpass').value = '';
    document.getElementById('s-newpass').value = '';
  }catch(e){ document.getElementById('pw-err').textContent = e.message; }
}
async function loadOauthBindings(){
  const box = document.getElementById('oauth-bindings');
  if(!box) return;
  try{
    const j = await api('/api/oauth/bindings');
    let h = '';
    const gh = (j.bindings||[]).find(b=>b.provider==='github');
    if(gh){
      h += '<div style="display:flex;align-items:center;gap:10px;padding:8px 0">'
        + '<span style="font-size:14px">🐙 GitHub 已绑定</span>'
        + '<span style="font-size:12px;color:var(--muted)">'+new Date(gh.created_at).toLocaleDateString()+'</span>'
        + '<button class="btn ghost" style="width:auto;padding:4px 12px;font-size:12px" onclick="unbindOauth(\'github\')">解绑</button></div>';
    }else if(j.githubConfigured){
      h += '<div style="padding:8px 0"><button class="btn ghost" style="width:auto" onclick="location.href=\'/api/auth/github\'">🐙 绑定 GitHub</button></div>';
    }
    if(!h) h = '<div style="color:var(--muted);font-size:13px">暂无可用的第三方登录</div>';
    box.innerHTML = h;
  }catch(e){ box.innerHTML = '<div style="color:var(--muted);font-size:13px">加载失败</div>'; }
}
async function unbindOauth(provider){
  if(!confirm('确定解绑 '+provider+' 吗？')) return;
  try{ await api('/api/oauth/unbind',{method:'POST',body:JSON.stringify({provider})}); loadOauthBindings(); }
  catch(e){ alert(e.message); }
}
async function changeEmail(){
  const email = document.getElementById('s-email').value.trim();
  if(!confirm('更换邮箱后需要重新验证，确定吗？')) return;

async function buyItem(id, price){
  if(!confirm('确定花 '+price+' 积分兑换吗？')) return;
  try{
    const j = await api('/api/shop/buy', {method:'POST', body:JSON.stringify({item_id:id})});
    if(j.ok){
      if(j.code){ alert('兑换成功！\n\n你的兑换码：'+j.code+'\n\n已保存到"我的物品"，请妥善保管。'); }
      else alert('兑换成功！');
      viewShop(); refreshMe();
    }
  }catch(e){ alert(e.message); }
}
async function useItem(id, type){
  let extra = '', thread_id = null;
  // 从缓存取商品 params（置顶时长）
  const _it = (window._myItems || []).find(x => x.id === id);
  let _hours = 24;
  try{ const p = JSON.parse((_it && _it.params) || '{}'); if(p.duration_hours) _hours = p.duration_hours; }catch(e){}
  if(type==='rename_card'){
    extra = prompt('请输入新用户名：');
    if(!extra) return;
  }else if(type==='custom_title'){
    extra = prompt('请输入自定义头衔（最多20字）：');
    if(!extra) return;
  }else if(type==='pin_card'){
    // 拉取我的帖子列表来选
    try{
      const j = await api('/api/users/'+me.id);
      if(!j.threads.length){ alert('你还没有发过帖子'); return; }
      let html = '<h3>选择要置顶的帖子（'+_hours+'小时）</h3>';
      j.threads.slice(0,10).forEach(t=>{
        html += '<div class="thread" style="margin:8px 0" onclick="doPinCard('+id+','+t.id+','+_hours+')"><div class="ti">'+esc(t.title)+'</div><div class="mt"><span>'+esc(t.board_name)+'</span></div></div>';
      });
      showModal(html);
      return;
    }catch(e){ alert('加载帖子失败'); return; }
  }else if(type==='avatar_frame'){
    if(!confirm('确定使用头像框吗？')) return;
  }
  try{
    const body = {user_item_id:id};
    if(extra) body.extra = extra;
    if(thread_id) body.thread_id = thread_id;
    const j = await api('/api/shop/use', {method:'POST', body:JSON.stringify(body)});
    if(j.ok){ alert('使用成功！'); await refreshMe(); viewShop(); }
  }catch(e){ alert(e.message); }
}
async function doPinCard(itemId, threadId, hours){
  hideModal();
  if(!confirm('确定置顶这个帖子 '+(hours||24)+' 小时吗？')) return;
  try{
    const j = await api('/api/shop/use', {method:'POST', body:JSON.stringify({user_item_id:itemId, thread_id:threadId})});
    if(j.ok){ alert('置顶成功！'); viewShop(); }
  }catch(e){ alert(e.message); }
}
async function transferPoints(uid, name){
  const amount = prompt('转增积分给 '+name+'（单次最多 1000 分）：');
  if(!amount) return;
  const n = Math.floor(Number(amount));
  if(!n || n < 1){ alert('请输入有效数量'); return; }
  if(!confirm('确定转增 '+n+' 分给 '+name+' 吗？')) return;
  try{
    const j = await api('/api/points/transfer', {method:'POST', body:JSON.stringify({to_user_id:uid, amount:n})});
    if(j.ok){ alert('转增成功！'); refreshMe(); }
  }catch(e){ alert(e.message); }
}

function doDiff(){
  const a = document.getElementById('diff-a').value.split('\n');
  const b = document.getElementById('diff-b').value.split('\n');
  const maxLen = Math.max(a.length, b.length);
  let html = '<div style="font-family:monospace;font-size:12px;line-height:1.6;background:var(--bg);border-radius:8px;padding:12px;overflow-x:auto">';
  let diffCount = 0;
  for(let i=0; i<maxLen; i++){
    const la = a[i] ?? '', lb = b[i] ?? '';
    if(la === lb){
      html += '<div style="color:var(--muted)"> '+esc(la||'&nbsp;')+'</div>';
    }else{
      diffCount++;
      if(la) html += '<div style="background:#3f1d1d;color:#f85149">- '+esc(la)+'</div>';
      if(lb) html += '<div style="background:#0d2818;color:#3fb950">+ '+esc(lb)+'</div>';
    }
  }
  html += '</div><div style="font-size:13px;color:var(--muted);margin-top:8px">共 '+diffCount+' 处差异</div>';
  document.getElementById('diff-out').innerHTML = html;
}

function shuffleArr(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function viewQuiz(){
  setTitle('Linux 段位测试');
  trackTool('quiz');
  // 如果是分享链接（?score=），直接展示该成绩
  const m = location.search.match(/score=(\d+)/);
  if(m){
    const score = Math.max(0, Math.min(100, parseInt(m[1])));
    showSharedQuizResult(score);
    return;
  }
  // 随机抽 20 题，每题选项打乱
  const pool = shuffleArr([...QUIZ_DB]);
  const picked = pool.slice(0, 20).map(q=>{
    const order = shuffleArr([0,1,2,3]);
    return { q:q.q, why:q.why, opts:order.map(i=>q.opts[i]), a:order.indexOf(q.a) };
  });
  quizState = { idx: 0, score: 0, answers: [], questions: picked };
  renderQuizQ();
}

function quizAnswer(choice){
  const s = quizState, q = s.questions[s.idx];
  const correct = choice === q.a;
  if(correct) s.score += 5;
  s.answers.push({ choice, correct });
  // 显示解析
  let html = '<div class="crumb" onclick="navigate(\'/tools\')">‹ 工具中心</div>'+
  '<div class="card"><h2 class="tt">🐧 Linux 段位测试</h2>'+
  '<div style="font-size:13px;color:var(--muted);margin-bottom:12px">第 '+(s.idx+1)+' / '+s.questions.length+' 题</div>'+
  '<div style="font-size:16px;font-weight:700;margin-bottom:16px">'+esc(q.q)+'</div><div style="display:grid;gap:10px">';
  q.opts.forEach((o, i)=>{
    let style = '', mark = '';
    if(i === q.a){ style = 'border:2px solid #16a34a;background:var(--hl)'; mark = ' ✓'; }
    else if(i === choice){ style = 'border:2px solid #dc2626'; mark = ' ✗'; }
    html += '<div class="thread" style="'+style+'"><div style="font-size:14px">'+esc(o)+mark+'</div></div>';

function parseCommand(input){
  // 简单分词：处理引号
  const tokens = [];
  let cur = '', inQuote = null;
  for(let i=0; i<input.length; i++){
    const c = input[i];
    if(inQuote){
      if(c === inQuote){ inQuote = null; }
      else cur += c;
    }else if(c === '"' || c === "'"){ inQuote = c; }
    else if(c === ' ' || c === '\t'){ if(cur){ tokens.push(cur); cur=''; } }
    else cur += c;
  }
  if(cur) tokens.push(cur);
  return tokens;
}
function doExplain(){
  const input = document.getElementById('exp-input').value.trim();
  const out = document.getElementById('exp-out');
  if(!input){ out.innerHTML = '<div class="hint">请输入一条命令</div>'; return; }
  const tokens = parseCommand(input);
  if(!tokens.length){ out.innerHTML = '<div class="hint">无法解析</div>'; return; }
  const cmd = tokens[0];
  const info = CMD_DB[cmd];
  let html = '';
  // 命令头
  html += '<div style="background:var(--bg);border-radius:8px;padding:12px;margin-bottom:12px;font-family:monospace;font-size:14px;word-break:break-all">';
  html += '<span style="color:var(--primary);font-weight:700">'+esc(cmd)+'</span>';
  tokens.slice(1).forEach(t=>{
    const isFlag = t.startsWith('-');
    html += ' <span style="color:'+(isFlag?'#d97706':'var(--text)')+'">'+esc(t)+'</span>';
  });
  html += '</div>';
  if(!info){
    html += '<div class="hint">😅 暂未收录 "'+esc(cmd)+'" 的详解<br><span style="font-size:12px">已收录 '+Object.keys(CMD_DB).length+' 个常用命令，更多命令持续补充中</span></div>';
  }else{
    html += '<div style="font-size:15px;font-weight:700;margin-bottom:8px">'+esc(info.desc)+'</div>';
    if(info.tips) html += '<div style="font-size:13px;background:var(--hl);border-radius:8px;padding:10px 12px;margin-bottom:12px">💡 '+esc(info.tips)+'</div>';
    // 逐个解释参数
    const args = tokens.slice(1);
    if(args.length){
      html += '<div style="font-size:14px;font-weight:700;margin:12px 0 8px">参数详解：</div>';
      let i = 0;
      const explained = new Set();
      while(i < args.length){
        const t = args[i];
        let desc = null, extra = null;
        if(info.flags[t]){
          desc = info.flags[t];
        }else if(t.startsWith('--')){
          // 长参数：尝试匹配 --key=value
          const eq = t.indexOf('=');
          const key = eq > 0 ? t.slice(0, eq) : t;
          desc = info.flags[key] || null;
          if(desc && eq > 0) extra = t.slice(eq+1);
        }else if(t.startsWith('-') && t.length > 2 && !t.startsWith('--')){
          // 合并短参数：如 -xzf 拆成 -x -z -f
          const parts = [];
          for(const ch of t.slice(1)){
            const f = '-'+ch;
            if(info.flags[f]) parts.push(f);
          }
          if(parts.length){
            desc = parts.map(p=>'<code style="background:var(--bg);padding:1px 6px;border-radius:4px">'+esc(p)+'</code> '+esc(info.flags[p])).join('<br>');
          }
        }
        // 下一个 token 可能是参数的值
        let val = null;
        if(desc && i+1 < args.length && !args[i+1].startsWith('-') && !explained.has(args[i+1])){
          // 启发式：如果当前 flag 描述里暗示需要值，则吃掉下一个
          val = args[i+1];
        }
        if(desc){
          html += '<div style="border-left:3px solid var(--primary);padding:8px 12px;margin-bottom:8px;background:var(--bg);border-radius:0 8px 8px 0">';
          html += '<div style="font-family:monospace;font-weight:700;color:#d97706">'+esc(t)+(val?' <span style="color:var(--muted);font-weight:400">'+esc(val)+'</span>':'')+'</div>';
          html += '<div style="font-size:13px;margin-top:4px">'+desc+'</div>';
          if(extra) html += '<div style="font-size:12px;color:var(--muted)">值：'+esc(extra)+'</div>';
          html += '</div>';
          if(val){ explained.add(val); i++; }
        }else if(!explained.has(t)){
          // 未知参数或普通参数
          const isFlag = t.startsWith('-');
          html += '<div style="border-left:3px solid var(--border);padding:8px 12px;margin-bottom:8px;border-radius:0 8px 8px 0">';
          html += '<div style="font-family:monospace;font-weight:700">'+esc(t)+'</div>';
          html += '<div style="font-size:13px;color:var(--muted)">'+(isFlag?'未收录该参数，可能是命令特有参数':'命令的操作对象（文件/目录/值）')+'</div></div>';
        }
        i++;
      }
    }
    if(info.extra) html += '<div style="font-size:13px;background:var(--bg);border-radius:8px;padding:10px 12px;margin-top:12px">📚 '+esc(info.extra)+'</div>';
    if(info.example) html += '<div style="font-size:13px;margin-top:12px"><span style="color:var(--muted)">示例：</span><code style="background:var(--bg);padding:4px 8px;border-radius:4px;font-family:monospace">'+esc(info.example)+'</code> <span style="cursor:pointer;color:var(--primary);font-size:12px" onclick="navigator.clipboard.writeText(\''+info.example.replace(/'/g,"\\'")+'\');alert(\'已复制\')">复制</span></div>';
  }
  // 分享链接
  const shareUrl = location.origin + '/tools/explain?cmd=' + encodeURIComponent(input);
  html += '<div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border);font-size:13px;color:var(--muted)">🔗 分享这条解释：<span style="cursor:pointer;color:var(--primary);word-break:break-all" onclick="navigator.clipboard.writeText(\''+shareUrl+'\');alert(\'链接已复制\')">'+esc(shareUrl)+'</span></div>';
  out.innerHTML = html;
  // 更新 URL（不刷新）
  history.replaceState({}, '', '/tools/explain?cmd=' + encodeURIComponent(input));
}
function doShellcheck(){
  const code = document.getElementById('sh-code').value;
  const issues = [];
  const lines = code.split('\n');
  lines.forEach((ln, idx)=>{
    const n = idx + 1;
    if(/rm\s+-rf?\s+\/$/.test(ln) || /rm\s+-rf?\s+\/\*/.test(ln)) issues.push([n, 'danger', '检测到 rm -rf / 或 /*，极度危险！请三思']);
    else if(/rm\s+-rf?\s+\$[A-Za-z_]+[^}]*$/.test(ln) && !/\$\{[A-Za-z_]+:?[+-]/.test(ln)) issues.push([n, 'warn', 'rm -rf 接未判空变量，变量为空时会删根目录，建议用 ${VAR:?}']);
    if(/[^\\]?\$\w+[^"\s]*\//.test(ln) && /cp|mv|rm/.test(ln)) issues.push([n, 'warn', '变量未加引号，路径含空格会出错，建议 "$VAR"']);
    if(/==/.test(ln) && /\[ /.test(ln)) issues.push([n, 'warn', '[ ] 里用 = 不用 ==，== 是 [[ ]] 的写法']);
    if(/`[^`]*`/.test(ln)) issues.push([n, 'info', '建议用 $(...) 代替反引号，可读性更好']);
    if(/echo\s+\$/.test(ln) && !/echo\s+"\$/.test(ln)) issues.push([n, 'info', 'echo 变量建议加引号']);
    if(/for\s+\w+\s+in\s+\$\(ls/.test(ln)) issues.push([n, 'warn', '不要 for i in $(ls)，用 for i in * 或 glob']);
    if(/^\s*cd\s/.test(ln) && !/||/.test(ln)) issues.push([n, 'warn', 'cd 失败不检查，后续命令会在错误目录执行，建议 cd dir || exit']);
  });
  if(!code.trim()){ document.getElementById('sh-out').innerHTML = '<div class="hint">请先粘贴脚本</div>'; return; }
  const colors = {danger:'#f85149', warn:'#d97706', info:'var(--primary)'};
  const labels = {danger:'⛔ 危险', warn:'⚠️ 警告', info:'💡 建议'};
  let html = '';
  if(!issues.length) html = '<div style="background:var(--hl);border-radius:8px;padding:16px;color:var(--primary);font-weight:700">✓ 没发现明显问题，脚本看起来不错！</div>';
  else{
    html = '<div style="font-size:13px;color:var(--muted);margin-bottom:8px">发现 '+issues.length+' 个问题：</div>';
    issues.forEach(([n, lv, msg])=>{
      html += '<div style="border-left:3px solid '+colors[lv]+';padding:8px 12px;margin-bottom:8px;background:var(--bg);border-radius:0 8px 8px 0">'+
        '<div style="font-size:12px;color:'+colors[lv]+';font-weight:700">'+labels[lv]+' · 第 '+n+' 行</div>'+
        '<div style="font-size:13px">'+esc(msg)+'</div></div>';
    });
  }
  document.getElementById('sh-out').innerHTML = html;
}

}

async function adminBan(uid, banned){
  if(!confirm(banned ? '禁言该用户？他将无法发帖回帖' : '解除禁言？')) return;
  try{ await api('/api/admin/users/'+uid+'/ban', {method:'POST', body:JSON.stringify({banned})}); route(); }
  catch(e){ alert(e.message); }
}
async function adminRole(uid, is_admin){
  if(!confirm(is_admin ? '设为管理员？' : '撤销管理员？')) return;
  try{ await api('/api/admin/users/'+uid+'/role', {method:'POST', body:JSON.stringify({is_admin})}); route(); }
  catch(e){ alert(e.message); }
}
async function adminPoints(uid, name, curPoints){
  const input = prompt('调整 '+name+' 的积分（当前 '+curPoints+' 分），输入正负数，如 100 或 -50：');
  if(!input) return;
  const points = Math.floor(Number(input));
  if(!points){ alert('请输入有效数字'); return; }
  const reason = prompt('调整原因（选填）：') || '管理员调整';
  if(!confirm('确定给 '+name+' '+(points>0?'+':'')+points+' 分吗？')) return;
  try{ await api('/api/admin/users/'+uid+'/points', {method:'POST', body:JSON.stringify({points, reason})}); alert('调整成功'); route(); }
  catch(e){ alert(e.message); }
}
function filterUsers(){
  const q = (document.getElementById('u-search').value || '').toLowerCase().trim();
  document.querySelectorAll('#u-list .urow').forEach(row=>{
    row.style.display = !q || (row.dataset.search||'').includes(q) ? '' : 'none';
  });
}
async function adminDelUser(uid, name){
  if(!confirm('删除用户「'+name+'」？他的所有主题和回帖也会被删除，不可恢复！')) return;
  try{ await api('/api/admin/users/'+uid, {method:'DELETE'}); route(); }
  catch(e){ alert(e.message); }
}

let _shopEditId = 0;
function shopTypeChange(){
  const t = document.getElementById('si-type').value;
  document.getElementById('si-duration-row').style.display = t==='pin_card' ? '' : 'none';
  document.getElementById('si-codes-row').style.display = (t==='card' && !_shopEditId) ? '' : 'none';
}
function adminEditShopItem(id){
  const it = (window._shopItems || []).find(x => x.id === id);
  if(!it) return;
  _shopEditId = id;
  document.getElementById('si-name').value = it.name || '';
  document.getElementById('si-icon').value = it.icon || '';
  document.getElementById('si-price').value = it.price || '';
  document.getElementById('si-type').value = it.item_type;
  document.getElementById('si-type').disabled = true;
  document.getElementById('si-descr').value = it.descr || '';
  document.getElementById('si-usage').value = it.usage || '';
  document.getElementById('si-sort').value = it.sort || 99;
  try{
    const p = JSON.parse(it.params || '{}');
    if(p.duration_hours) document.getElementById('si-duration').value = p.duration_hours;
  }catch(e){}
  shopTypeChange();
  document.getElementById('si-form-title').textContent = '编辑商品';
  document.getElementById('si-submit').textContent = '保存修改';
  document.getElementById('si-cancel').style.display = '';
  window.scrollTo({top: 0, behavior: 'smooth'});
}
function adminCancelEditShop(){
  _shopEditId = 0;
  document.getElementById('si-name').value = '';
  document.getElementById('si-icon').value = '';
  document.getElementById('si-price').value = '';
  document.getElementById('si-type').value = 'pin_card';
  document.getElementById('si-type').disabled = false;
  document.getElementById('si-descr').value = '';
  document.getElementById('si-usage').value = '';
  document.getElementById('si-sort').value = 99;
  document.getElementById('si-duration').value = 24;
  document.getElementById('si-codes').value = '';
  shopTypeChange();
  document.getElementById('si-form-title').textContent = '上架商品';
  document.getElementById('si-submit').textContent = '上架';
  document.getElementById('si-cancel').style.display = 'none';
}
async function adminAddShopItem(){
  const name = document.getElementById('si-name').value.trim();
  const icon = document.getElementById('si-icon').value.trim() || '🎁';
  const price = parseInt(document.getElementById('si-price').value) || 0;
  const item_type = document.getElementById('si-type').value;
  const descr = document.getElementById('si-descr').value.trim();
  const usage = document.getElementById('si-usage').value.trim();
  const sort = parseInt(document.getElementById('si-sort').value) || 99;
  if(!name || !price){ alert('名称和价格必填'); return; }
  const params = {};
  if(item_type==='pin_card'){
    params.duration_hours = parseInt(document.getElementById('si-duration').value) || 24;
  }
  // 编辑模式
  if(_shopEditId){
    try{
      await api('/api/admin/shop/items/'+_shopEditId, {method:'PUT', body:JSON.stringify({name, icon, price, descr, usage, sort, params})});

function pager(page, per, total, base){
  const pages = Math.max(1, Math.ceil(total/per));
  if(pages<=1) return '';
  let h = '<div class="toolbar" style="justify-content:center;margin:12px 0">';
  if(page>1) h += '<button class="btn ghost" onclick="navigate(\''+base+'?p='+(page-1)+'\')">‹ 上一页</button>';
  h += '<span style="align-self:center;font-size:13px;color:var(--muted)">'+page+' / '+pages+'</span>';
  if(page<pages) h += '<button class="btn ghost" onclick="navigate(\''+base+'?p='+(page+1)+'\')">下一页 ›</button>';
  return h+'</div>';
}

      ops += '<button onclick="showEditPost('+p.id+')">编辑</button><button class="danger" onclick="delPost('+p.id+')">删除</button>';
    }
    html += '<div class="card post'+(isOP?' op-post':'')+(isSolution?' solution-post':'')+'" data-pid="'+p.id+'">'+
      '<div class="ph"><div class="author-info">'+avatarHtml(p.avatar_url, p.author, '', p.avatar_frame)+
      '<div class="author-meta"><div style="display:flex;align-items:center;flex-wrap:wrap;gap:4px">'+authorLink(p.user_id,p.author)+(p.custom_title?'<span style="font-size:11px;color:var(--primary);border:1px solid var(--primary);border-radius:4px;padding:0 4px;white-space:nowrap">'+esc(p.custom_title)+'</span>':'')+'</div>'+
      '<div class="author-sub">'+(isOP?'<span style="color:var(--primary);font-weight:600">楼主</span> · ':'')+(isSolution?'<span class="solution-badge">✓ 解决方案</span> · ':'')+timeAgo(p.created_at)+(p.updated_at?' · 已编辑':'')+'</div></div></div>'+
      '<span class="floor">#'+floor+'</span></div>'+
      '<div class="pc">'+renderContent(p.content)+'</div><div class="ops">'+ops+'</div></div>';
  });
  html += adHtml('thread_bottom');
  html += pager(j.page, j.per, j.total, '/t/'+tid);
  if(t.is_locked && !(me && me.is_admin)){
    html += '<div class="card" style="text-align:center;padding:24px"><div style="font-size:14px;color:var(--muted)">🔒 该主题已被管理员锁定，无法回复</div></div>';
  }else if(me){
    html += '<div class="card"><h3 style="font-size:16px;margin-bottom:12px">💬 发表回复</h3><div id="quote-preview"></div>'+
      editorToolbar('reply-box')+
      '<textarea id="reply-box" placeholder="写下你的回复…（可用 @用户名 提醒他）"></textarea>'+
      '<button class="btn" onclick="doReply('+t.id+')">回复</button></div>';
  }else{
    html += '<div class="card" style="text-align:center;padding:24px"><div style="font-size:14px;color:var(--muted);margin-bottom:12px">登录后参与讨论</div><button class="btn" style="width:auto;padding:10px 32px" onclick="showLogin()">登录 / 注册</button></div>';
  }
  app.innerHTML = html;
  bindDraft('reply-box', 'reply-' + tid);
  bindAtComplete('reply-box');
  setTitle(t.title);
}
function threadPage(){
  const m = location.pathname.match(/^\/t\/(\d+)/);
  return m ? Number(m[1]) : null;
}
async function goToPost(pid){
  try{
    const j = await api('/api/posts/'+pid+'/locate');
    navigate('/t/'+j.thread_id+'?p='+j.page);
    // 等页面渲染后滚动到对应楼层
    setTimeout(()=>{
      const el = document.querySelector('[data-pid="'+pid+'"]');
      if(el){
        el.scrollIntoView({behavior:'smooth', block:'center'});
        el.style.boxShadow = '0 0 0 2px var(--primary)';
        setTimeout(()=>{ el.style.boxShadow = ''; }, 2000);
      }
    }, 600);
  }catch(e){ alert(e.message); }
}
function showReport(target_type, target_id){
  showModal('<h3>举报'+(target_type==='thread'?'主题':'回帖')+'</h3><div class="err" id="m-err"></div>'+
    '<textarea id="m-reason" style="min-height:80px" placeholder="请描述举报理由…"></textarea>'+
    '<div class="row"><button class="btn ghost" onclick="hideModal()">取消</button><button class="btn" onclick="doReport(\''+target_type+'\','+target_id+')">提交举报</button></div>');
}
async function doReport(target_type, target_id){
  const reason = document.getElementById('m-reason').value.trim();
  if(!reason){ document.getElementById('m-err').textContent = '请填写举报理由'; return; }
  try{
    await api('/api/reports', {method:'POST', body:JSON.stringify({target_type, target_id, reason})});
    hideModal(); alert('举报已提交，管理员会尽快处理');
  }catch(e){ document.getElementById('m-err').textContent = e.message; }
}
async function toggleFav(tid, btn){
  if(!me){ showLogin(); return; }
  try{
    const j = await api('/api/threads/'+tid+'/favorite', {method:'POST'});
    btn.classList.toggle('on', j.favorited);
    btn.textContent = j.favorited ? '★ 已收藏' : '☆ 收藏';
  }catch(e){ alert(e.message); }
}
function shareThread(){
  const url = location.origin + '/t/' + threadPage();
  if(navigator.clipboard){ navigator.clipboard.writeText(url).then(()=>alert('链接已复制')).catch(()=>prompt('复制链接：', url)); }
  else prompt('复制链接：', url);
}
function toggleAuthorOnly(tid){
  curThreadOpts.authorOnly = !curThreadOpts.authorOnly;
  viewThread(tid, 1);
}
function toggleOrder(tid){
  curThreadOpts.orderDesc = !curThreadOpts.orderDesc;
  viewThread(tid, 1);
}
window.addEventListener('scroll', ()=>{
  const b = document.getElementById('toTop');
  if(!b) return;
  const onThread = /^\/t\/\d+/.test(location.pathname);
  b.style.display = (onThread && window.scrollY > 400) ? '' : 'none';
});
async function toggleLike(pid, btn){
  if(!me){ showLogin(); return; }
  try{
    const j = await api('/api/posts/'+pid+'/like', {method:'POST'});
    btn.classList.toggle('on', j.liked);
    btn.innerHTML = (j.liked?'♥':'♡')+' '+j.count;
  }catch(e){ alert(e.message); }
}
async function toggleSolution(pid, mark){
  if(!me){ showLogin(); return; }
  try{
    await api('/api/posts/'+pid+(mark?'/solution':'/unsolution'), {method:'POST'});
    route();
  }catch(e){ alert(e.message); }
}
function quotePost(pid){
  const p = curPosts.find(x=>x.id===pid);
  if(!p) return;
  // 计算楼层
  const idx = curPosts.findIndex(x=>x.id===pid);
  const floor = idx >= 0 ? idx + 1 : '?';
  const box = document.getElementById('reply-box');
  const q = p.content.length > 100 ? p.content.slice(0,100)+'…' : p.content;
  document.getElementById('quote-preview').innerHTML =
    '<div class="quotebox">引用 <b>'+esc(p.author)+'</b> #'+floor+'：'+esc(q)+'<div style="text-align:right"><button class="opbtn" style="font-size:12px" onclick="clearQuote()">取消引用</button></div></div>';
  box.value = '> [quote pid='+p.id+' author='+p.author+' floor='+floor+']\n> '+p.content.split('\n').join('\n> ').slice(0,200)+'\n\n' + box.value;
  box.focus();
}
function clearQuote(){
  document.getElementById('quote-preview').innerHTML = '';
  const box = document.getElementById('reply-box');
  box.value = box.value.replace(/^> .*\n\n/, '');
}
function showEditPost(pid){
  const p = curPosts.find(x=>x.id===pid);
  if(!p) return;
  showModal('<h3>编辑回帖</h3><div class="err" id="m-err"></div>'+
    editorToolbar('m-content')+
    '<textarea id="m-content">'+esc(p.content)+'</textarea>'+
    '<div class="row"><button class="btn ghost" onclick="hideModal()">取消</button><button class="btn" onclick="doEditPost('+pid+')">保存</button></div>');
}
async function doEditPost(pid){
  const content = document.getElementById('m-content').value.trim();
  try{ await api('/api/posts/'+pid,{method:'PUT',body:JSON.stringify({content})}); hideModal(); route(); }
  catch(e){ document.getElementById('m-err').textContent = e.message; }
}
async function doReply(tid){
  const content = document.getElementById('reply-box').value.trim();
  if(!content) return;
  try{ await api('/api/posts',{method:'POST',body:JSON.stringify({thread_id:tid,content})}); clearDraft('reply-' + tid); route(); }
  catch(e){ alert(e.message); if(e.message.includes('验证邮箱')) route(); }
}
async function delPost(pid){
  if(!confirm('删除这条回帖？')) return;
  try{ const j = await api('/api/posts/'+pid,{method:'DELETE'}); if(j.threadDeleted) navigate('/'); else route(); }
  catch(e){ alert(e.message); }
}
async function delThread(tid, bid){
  if(!confirm('删除整个主题？')) return;
  try{ await api('/api/threads/'+tid,{method:'DELETE'}); navigate('/b/')+bid; }
  catch(e){ alert(e.message); }
}
async function toggleDigest(tid, digest){
  try{ await api('/api/threads/'+tid+'/digest',{method:'POST',body:JSON.stringify({digest})}); route(); }
  catch(e){ alert(e.message); }
}
async function toggleLock(tid, locked){
  try{ await api('/api/threads/'+tid+'/lock',{method:'POST',body:JSON.stringify({locked})}); route(); }
  catch(e){ alert(e.message); }
}
async function togglePin(tid, pinned){
  try{ await api('/api/threads/'+tid+'/pin',{method:'POST',body:JSON.stringify({pinned})}); route(); }
  catch(e){ alert(e.message); }
}

refreshMe().then(()=>loadSiteSettings()).then(()=>loadAds()).then(()=>{
  const oe = new URLSearchParams(location.search).get('oauth_error');
  if(oe){ history.replaceState(null,'',location.pathname); setTimeout(()=>alert('GitHub 登录失败：'+decodeURIComponent(oe)), 300); }
  loadSidebar(); route();
});
</script>
